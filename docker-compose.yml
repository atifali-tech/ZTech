# Development docker-compose — hot reload, local DB, no SSL.
# Usage: docker compose up
# For production use docker-compose.prod.yml instead.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       zingparks
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: deps        # dev: include devDependencies for nodemon
    working_dir: /app
    command: npx nodemon index.js
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:     development
      PORT:         4000
      DB_HOST:      postgres
      DB_PORT:      5432
      DB_NAME:      zingparks
      DB_USER:      postgres
      DB_PASSWORD:  ${DB_PASSWORD:-devpassword}
      JWT_SECRET:   ${JWT_SECRET:-dev_jwt_secret_replace_in_production_32chars_min}
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules    # prevent host node_modules from shadowing container
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      target: deps
    working_dir: /app
    command: npm run dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"

volumes:
  pgdata:
