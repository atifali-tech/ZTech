# Production docker-compose — built images, no bind mounts, secrets via env.
#
# Pre-requisites:
#   1. Set all required env vars in a .env.prod file or CI/CD secrets.
#   2. Build images: docker compose -f docker-compose.prod.yml build
#   3. Run migrations before first start:
#        docker compose -f docker-compose.prod.yml run --rm backend node scripts/migrate.js
#   4. Start: docker compose -f docker-compose.prod.yml up -d
#
# Required environment variables (set in shell or .env.prod):
#   DB_PASSWORD, JWT_SECRET, CORS_ORIGINS, FRONTEND_URL, NEXT_PUBLIC_API_URL

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB:       ${DB_NAME:-zingparks}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    # Do NOT expose port 5432 externally in production.
    # Backend connects via the internal Docker network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: runtime
    image: zingparks-backend:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:      production
      PORT:          4000
      DB_HOST:       postgres
      DB_PORT:       5432
      DB_NAME:       ${DB_NAME:-zingparks}
      DB_USER:       ${DB_USER:-postgres}
      DB_PASSWORD:   ${DB_PASSWORD}
      JWT_SECRET:    ${JWT_SECRET}
      CORS_ORIGINS:  ${CORS_ORIGINS}
      FRONTEND_URL:  ${FRONTEND_URL}
      TRUST_PROXY:   1
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: zingparks-frontend:latest
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT:     3000
    ports:
      - "3000:3000"

volumes:
  pgdata_prod:
